services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marejada_backend
    restart: unless-stopped
    volumes:
      - marejada_db_data:/app/data
      - marejada_uploads:/app/uploads
    ports:
      - "8400:8000"
    networks:
      - root_default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marejada_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3400:80"
    networks:
      - root_default

volumes:
  marejada_db_data:
  marejada_uploads:

networks:
  root_default:
    external: true
